{% comment %}
Zurück/Weiter-Navigation der geführten Präjudiziensuche.
{% endcomment %}
{# --- Navigation --- #}
<div class="d-flex justify-content-between mt-4 pt-3 border-top" x-show="aktuellerKey !== 'ergebnis'">
  <button type="button" class="btn btn-outline-secondary" x-show="schritt > 0" @click="zurueck()">
    <i class="bi bi-arrow-left"></i> zurück
  </button>
  <span x-show="schritt === 0"></span>
  <div class="d-flex flex-wrap gap-2 align-items-center justify-content-end">
    {# Optionaler Hinweis der spezifischen Komponente auf eine wichtige offene Frage #}
    {# Klick springt zum Element mit data-pf-hinweis-ziel, falls vorhanden #}
    <button type="button" class="btn btn-link btn-sm text-warning-emphasis text-decoration-none"
            x-show="weiterHinweis" x-cloak
            @click="document.querySelector('[data-pf-hinweis-ziel]')?.scrollIntoView({behavior: 'smooth', block: 'center'})">
      <i class="bi bi-exclamation-circle"></i> <span x-text="weiterHinweis"></span>
    </button>
    <button type="button" class="btn btn-link" x-show="schritt > 0" @click="zumErgebnis()">
      direkt zum Ergebnis
    </button>
    <button type="button" class="btn btn-primary" :disabled="!a.hauptdelikt" @click="weiter()">
      <span x-text="schritt === 0 && !a.hauptdelikt ? 'Bitte Hauptdelikt wählen' : 'weiter'"></span>
      <i class="bi bi-arrow-right"></i>
    </button>
  </div>
</div>
